// The static copy in content.js marks emphasis with **double asterisks**.
// Small enough that a full markdown parser would be overkill.
function RichText({ text }) {
  const parts = String(text).split(/\*\*(.+?)\*\*/g);
  return (
    <React.Fragment>
      {parts.map((part, i) => (i % 2 === 1 ? <strong key={i}>{part}</strong> : part))}
    </React.Fragment>
  );
}

// Click the logo a handful of times, purely for fun, doesn't touch
// anything else in the app.
function useLogoEasterEgg() {
  const [showCredits, setShowCredits] = useState(false);
  const clicks = useRef(0);
  const resetTimer = useRef(null);

  function onLogoClick() {
    clicks.current += 1;
    clearTimeout(resetTimer.current);
    resetTimer.current = setTimeout(() => { clicks.current = 0; }, 1500);
    if (clicks.current >= 5) {
      clicks.current = 0;
      setShowCredits(true);
      setTimeout(() => setShowCredits(false), 4000);
    }
  }

  return { showCredits, onLogoClick };
}

function StatusPill({ status }) {

function ResultBox({ state }) {
  if (!state) return null;
  return (
    <div className={`result ${state.kind}`}>
      {state.kind === "error" ? state.text : (
        <dl>

function OrderLookupCard() {
  const [orderId, setOrderId] = useState("ORD-70211");
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);

  async function lookup() {
    const id = orderId.trim();
    if (!id) { setResult({ kind: "error", text: "Enter an order ID." }); return; }
    setLoading(true);
    setResult({ kind: "pending", text: "Looking up..." });
    try {
      const resp = await fetch(`${API_BASE}/orders/${encodeURIComponent(id)}`);
      const body = await resp.json();
      if (!resp.ok) {
        setResult({ kind: "error", text: body.detail || `Error ${resp.status}` });
        return;
      }
      setResult({
        kind: "success",
        rows: [
          ["Order", body.order_id],
          ["Status", <StatusPill status={body.status} />],
          ["Total", `$${body.total.toFixed(2)}`],
          ["Refunded so far", `$${body.total_refunded.toFixed(2)}`],
          ["Notes", body.notes],
        ],
      });
    } catch (err) {
      setResult({ kind: "error", text: `Could not reach the backend: ${err.message}` });
    } finally {
      setLoading(false);
    }
  }

  return (
    <section className="card">
      <div className="card-title">
        <svg className="icon" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16Zm10 2-4.35-4.35" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" /></svg>
        <h2>Look up an order</h2>
        <span className="title-aside">Merchant feed</span>
      </div>
      <div className="row">
        <div>
          <label htmlFor="lookup-id">Order ID</label>
          <input id="lookup-id" value={orderId} onChange={(e) => setOrderId(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && lookup()} placeholder="ORD-70211" />
        </div>
        <button onClick={lookup} disabled={loading}>Look up</button>
      </div>
      {result && result.kind !== "pending" ? <ResultBox state={result} /> : result ? <div className="result">{result.text}</div> : null}
      <p className="hint">Order records, including notes, come from the third-party merchant data feed.</p>
    </section>
  );
}

function RefundCard() {
  const [orderId, setOrderId] = useState("ORD-70211");
  const [amount, setAmount] = useState("");
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);

  async function submitRefund() {
    const id = orderId.trim();
    const amt = parseFloat(amount);
    if (!id || Number.isNaN(amt)) {
      setResult({ kind: "error", text: "Enter an order ID and an amount." });
      return;
    }
    setLoading(true);
    setResult({ kind: "pending", text: "Submitting..." });
    try {
      const resp = await fetch(`${API_BASE}/orders/${encodeURIComponent(id)}/refund`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ amount: amt }),
      });
      const body = await resp.json();
      if (!resp.ok) {
        setResult({ kind: "error", text: body.detail || `Error ${resp.status}` });
        return;
      }
      setResult({
        kind: "success",
        rows: [
          ["Order", body.order_id],
          ["Refunded", `$${body.refunded.toFixed(2)}`],
          ["Total refunded", `$${body.total_refunded.toFixed(2)}`],
        ],
      });
    } catch (err) {
      setResult({ kind: "error", text: `Could not reach the backend: ${err.message}` });
    } finally {
      setLoading(false);
    }
  }

  return (
    <section className="card">
      <div className="card-title">
        <svg className="icon" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 10h18M7 15h4M5 6h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2Z" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" /></svg>
        <h2>Issue a refund</h2>
        <span className="title-aside">Posts immediately</span>
      </div>
      <div className="row">
        <div>
          <label htmlFor="refund-id">Order ID</label>
          <input id="refund-id" value={orderId} onChange={(e) => setOrderId(e.target.value)} placeholder="ORD-70211" />
        </div>
        <div>
          <label htmlFor="refund-amount">Amount</label>
          <input id="refund-amount" type="number" step="0.01" value={amount}
            onChange={(e) => setAmount(e.target.value)} placeholder="10.00" />
        </div>
        <button onClick={submitRefund} disabled={loading}>Refund</button>
      </div>
      {result && result.kind !== "pending" ? <ResultBox state={result} /> : result ? <div className="result">{result.text}</div> : null}
      <p className="hint">Rejected refunds show here as errors. Refunds post to the card within 3&ndash;5 business days.</p>
    </section>
  );
}

// Chat pop-up. Talks to POST /message, one blocking call, no streaming,
// no history kept server-side, so an in-memory list of bubbles that
// disappears on reload is fine.
function ChatWidget() {
  const [open, setOpen] = useState(false);
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState("");
  const [sending, setSending] = useState(false);
  const scrollRef = useRef(null);

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages, open]);

  async function send(e) {
    e.preventDefault();
    const text = input.trim();
    if (!text || sending) return;
    setInput("");
    setMessages((m) => [...m, { role: "user", text }, { role: "agent", text: "Thinking...", pending: true }]);
    setSending(true);
    try {
      const resp = await fetch(`${API_BASE}/message`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text }),
      });
      const body = await resp.json();
      const reply = resp.ok ? body.reply : (body.detail || `Error ${resp.status}`);
      setMessages((m) => m.map((msg, i) => (i === m.length - 1 ? { role: "agent", text: reply } : msg)));
    } catch (err) {
      setMessages((m) => m.map((msg, i) => (i === m.length - 1 ? { role: "agent", text: `Could not reach the backend: ${err.message}` } : msg)));
    } finally {
      setSending(false);
    }
  }

  return (
    <React.Fragment>
      <button id="chat-toggle" onClick={() => setOpen((o) => !o)}>
        <ChatIcon /> Chat with assistant
      </button>
      {open && (
        <div id="chat-panel">
          <div id="chat-header">
            <ChatIcon className="icon" />
            <span>
              Purchase Protection Assistant
              <span className="sub">Internal &middot; GenAI gateway</span>
            </span>
            <button className="close" aria-label="Close" onClick={() => setOpen(false)}>&times;</button>
          </div>
          <div id="chat-messages" ref={scrollRef}>
            {messages.length === 0 && (
              <div className="bubble-row agent">
                <div className="bubble-avatar">AI</div>
                <div className="bubble agent">Ask me about a case, e.g. &ldquo;What's the status of order ORD-70211?&rdquo;</div>
              </div>
            )}
            {messages.map((m, i) => (
              <div className={`bubble-row ${m.role}`} key={i}>
                <div className="bubble-avatar">{m.role === "user" ? "JR" : "AI"}</div>
                <div className={`bubble ${m.role}${m.pending ? " pending" : ""}`}>{m.text}</div>
              </div>
            ))}
          </div>
          <div id="chat-disclaimer">
            Assistant replies are logged. Don't paste full card numbers or credentials.
          </div>
          <form id="chat-form" onSubmit={send}>
            <input value={input} onChange={(e) => setInput(e.target.value)}
              placeholder="Ask about an order..." autoComplete="off" />
            <button type="submit" disabled={sending}>Send</button>
          </form>
        </div>
      )}
    </React.Fragment>
  );
}

/* -------------------------------------------------------------------- app */

const ALL_VIEWS = CASE_VIEWS.concat(PROSE_VIEWS);

function readHash() {
  const hash = window.location.hash.replace(/^#/, "");
  return ALL_VIEWS.indexOf(hash) !== -1 ? hash : "lookup";
}

function App() {
  const [view, setView] = useState(readHash);

  // Hash routing, so the footer's Privacy / Terms links behave like links
  // and the back button works.
  useEffect(() => {
    const onHashChange = () => setView(readHash());
    window.addEventListener("hashchange", onHashChange);
    return () => window.removeEventListener("hashchange", onHashChange);
  }, []);

  function navigate(next) {
    window.location.hash = next;
    setView(next);
    window.scrollTo(0, 0);
  }

  return (
    <React.Fragment>
      <UtilityBar />
      <Header view={view} onNavigate={navigate} />

      {view === "lookup" && (
        <React.Fragment>
          <WelcomeBanner />
          <main className="shell case-grid">
            <OrderLookupCard />
            <RefundCard />
            <QueueCard />
            <PolicyCard />
            <ShortcutsCard />
          </main>
        </React.Fragment>
      )}

      {view === "history" && (
        <PlaceholderPage
          title="Case History"
          blurb="A searchable log of every case a rep has touched, with the refund decisions and notes attached. On the roadmap, not in this tool yet."
        />
      )}

      {view === "reports" && (
        <PlaceholderPage
          title="Reports"
          blurb="Refund volume, handle time, and case trends across the team. On the roadmap, not in this tool yet."
        />
      )}

      {PROSE_VIEWS.indexOf(view) !== -1 && <StaticPage page={CONTENT[view]} />}

      <Footer onNavigate={navigate} />
      <ChatWidget />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
